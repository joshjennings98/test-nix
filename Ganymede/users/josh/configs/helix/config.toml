# josh's helix config

theme = "gruvbox"

[editor]
mouse                    = true
idle-timeout             = 0
completion-timeout       = 5
completion-trigger-len   = 1
statusline.right         = ["register", "spacer", "version-control", "spacer", "workspace-diagnostics", "diagnostics"]
lsp.display-inlay-hints  = true
cursor-shape.insert      = "bar"
file-picker.hidden       = false
indent-guides.render     = true
soft-wrap.enable         = true
soft-wrap.wrap-indicator = ""
end-of-line-diagnostics  = "hint"

[editor.smart-tab]
enable = false

[editor.inline-diagnostics]
cursor-line = "warning"

[keys.normal]
g.o = "jump_backward"
g.O = "jump_forward"
esc = "keep_primary_selection"
G   = "goto_word"
w   = "expand_selection"
W   = "shrink_selection"
C-p = [":w!", ":pipe go-tools debug %{buffer_name}", ":w!"]

[keys.select.space.space]
t   = ":pipe tmux-popup --stdin -- fish"
c   = ":pipe tmux-popup --stdin -- claude"

[keys.normal.space.space]
t   = ":sh tmux-popup       -- fish"
c   = ":sh tmux-popup       -- claude"
g   = ":sh tmux-popup       -- lazygit"
"/" = ":sh tmux-popup --new -- serpl"
