# Josh's kitty config

## Options

font_family                iosevka
bold_font                  auto
italic_font                auto
bold_italic_font           auto
font_size 		 	           14.0
cursor_stop_blinking_after 0
scrollback_lines 			     10000
enable_audio_bell 			   no
focus_follows_mouse 		   yes
enabled_layouts 			     tall
tab_bar_edge 				       top
tab_bar_style       		   powerline
confirm_os_window_close 	 1
tab_title_template 			   "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title}"

## Keymapping

kitty_mod ctrl

map kitty_mod+enter       new_window_with_cwd
map kitty_mod+shift+x 		close_window_with_confirmation
map kitty_mod+shift+enter	new_tab
map kitty_mod+t 			    next_tab
map kitty_mod+shift+t 		previous_tab
map kitty_mod+tab 			  next_window
map kitty_mod+shift+tab 	move_window_forward

