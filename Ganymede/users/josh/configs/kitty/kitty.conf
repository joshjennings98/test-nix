# Josh's kitty config

## Options

font_family                iosevka
bold_font                  auto
italic_font                auto
bold_italic_font           auto
font_size                  14.0
cursor_stop_blinking_after 0
scrollback_lines           10000
enable_audio_bell          no
focus_follows_mouse        yes
enabled_layouts            splits
tab_bar_edge               top
tab_bar_style              powerline
confirm_os_window_close    1
disable_ligatures          always
tab_title_template         "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title}"
inactive_text_alpha        0.75
editor                     hx

## Keymapping

kitty_mod ctrl

map kitty_mod+enter       launch --location=split --cwd=current
map kitty_mod+shift+x     close_window_with_confirmation
map kitty_mod+shift+enter new_tab
map kitty_mod+shift+right next_tab
map kitty_mod+shift+left  previous_tab
map kitty_mod+right       next_window
map kitty_mod+left        previous_window
map kitty_mod+space       move_window_forward
map kitty_mod+shift+space move_window_backward
map kitty_mod+c           send_text all \x03
map kitty_mod+shift+v     paste_from_clipboard
map kitty_mod+shift+c     copy_to_clipboard
map kitty_mod+|           launch --location=vsplit --cwd=current
map kitty_mod+-           launch --location=hsplit --cwd=current
map kitty_mod+shift+f     kitten hints --type path --program -
map kitty_mod+shift+g     kitten hints --type regex --regex \\b[0-9a-f]{5,40}\\b --program -
map kitty_mod+shift+u     open_url_with_hints
map kitty_mod+e           no_op

